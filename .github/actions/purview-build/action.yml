name: Purview Build

description: >-
  Installs the Purview.Build dotnet tool from nuget.org (pinned via `build-version`, or the
  latest stable when omitted), registers nuget.org and the organisation GitHub Packages feed for the
  rest of the job, and runs the tool against the repository.
  Configuration flows through job environment variables (Build__*, Release__*, NuGet__*,
  PublishLocalNuGet__*) and secrets (NUGET_APIKEY, GITHUB_TOKEN, LOCAL_NUGET_FEED_PATH).
  Publishing to GitHub Packages is opt-in per repository; consuming from it is automatic.

inputs:
  build-version:
    description: >-
      Exact Purview.Build package version to run. When omitted, the latest stable version
      from nuget.org is installed.
    required: false
  dotnet-version:
    description: .NET SDK used by the consuming repository.
    required: false
    default: 10.0.x
  config-path:
    description: >-
      Explicit purview-build.json location (PURVIEW_BUILD_CONFIG). When omitted, the tool uses its
      documented probe order starting at the repository root.
    required: false
  packages-read-token:
    description: >-
      Optional classic PAT with read:packages used to read the organisation GitHub Packages feed.
      Defaults to the workflow token. Supply an organisation-level token when repositories should read
      packages without per-package "Manage Actions access" grants.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - uses: oven-sh/setup-bun@v2

    - name: Install shared build
      shell: bash
      run: |
        VERSION_ARGS=""
        if [ -n "${{ inputs.build-version }}" ]; then
          VERSION_ARGS="--version ${{ inputs.build-version }}"
        fi
        dotnet tool install Purview.Build --tool-path "${{ runner.temp }}/purview-build" $VERSION_ARGS

    # Same implementation the reusable workflows use. Registered after the tool install so the
    # bootstrap resolves Purview.Build from exactly the sources it always has.
    # A composite action has no post-step, so this configuration lasts for the rest of the job; the
    # runner is discarded on hosted agents, and the workflows add an explicit cleanup step.
    # Fork pull requests never receive organisation secrets, so registering a private feed there
    # would only produce a 401 against a source the run cannot read. They restore from NuGet.org.
    - name: Configure NuGet sources
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
      uses: purview-dev/build/.github/actions/nuget-sources@main
      with:
        namespace: ${{ github.repository_owner }}
        token: ${{ inputs.packages-read-token || github.token }}
        source-mapping: ${{ vars.PURVIEW_NUGET_SOURCE_MAPPING }}

    - name: Run shared build
      shell: bash
      run: |
        # Only forward config-path when the caller provided it: an empty PURVIEW_BUILD_CONFIG
        # would be an explicit-but-missing path, which the tool treats as an error.
        if [ -n "${{ inputs.config-path }}" ]; then
          export PURVIEW_BUILD_CONFIG="${{ inputs.config-path }}"
        fi
        "${{ runner.temp }}/purview-build/purview-build"
      env:
        GITHUB_TOKEN: ${{ github.token }}
