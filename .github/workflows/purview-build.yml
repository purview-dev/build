name: Purview Build

on:
  workflow_call:
    inputs:
      build-version:
        description: >-
          Exact Purview.Build package version to run. When omitted, the latest stable version
          from nuget.org is installed.
        required: false
        type: string
      dotnet-version:
        description: >-
          .NET SDK used by the consuming repository. Ignored when global.json pins an sdk.version,
          because every dotnet command resolves against global.json and installing anything else
          fails the job.
        required: false
        default: 10.0.x
        type: string
      node-version:
        description: >-
          Node.js used by the consuming repository's JavaScript tooling (for example Astro, which
          refuses to run below its minimum). Pinned rather than inherited from the runner image,
          whose Node version drifts between builds.
        required: false
        default: 26.x
        type: string
      release-mode:
        description: Release__Mode passed to the pipeline (None, NuGet, or GitHubRelease; LocalNuGet only works when run locally, not from a workflow).
        required: false
        default: None
        type: string
      run-tests:
        description: Enable discovered tests (Build__RunTests).
        required: false
        default: true
        type: boolean
      run-lint:
        description: Enable CSharpier linting (Build__RunLint).
        required: false
        default: true
        type: boolean
      run-pack:
        description: Enable packing (Build__RunPack).
        required: false
        default: true
        type: boolean
      validate-pack:
        description: Enable pack validation (Build__ValidatePack).
        required: false
        default: true
        type: boolean
      test-filter:
        description: Test filter (Build__TestFilter), e.g. "/*/*/*/*[Category=Unit]".
        required: false
        type: string
      test-projects:
        description: Comma-separated test project names/globs to run (Build__TestProjects).
        required: false
        type: string
      config-path:
        description: >-
          Explicit purview-build.json location (PURVIEW_BUILD_CONFIG). When omitted, the tool uses
          its documented probe order starting at the repository root.
        required: false
        type: string
    secrets:
      NUGET_APIKEY:
        required: false
      # Declared because consuming repositories historically store the key under this name and the
      # job forwards it as NUGET_API_KEY. A secret referenced but not declared here resolves only
      # under `secrets: inherit`; declaring it makes the contract explicit either way.
      NUGET__APIKEY:
        required: false
      # Optional organisation-level classic PAT with read:packages. When present, every repository
      # can read every package without per-package "Manage Actions access" grants; otherwise the
      # job token is used.
      PURVIEW_PACKAGES_READ_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # The SDK comes from `actions/dotnet-sdk`, the one implementation of "install what global.json
      # pins". It is shared with this repository's own ci.yml/release.yml and with any consuming job
      # that is not a call to a shared workflow, so the resolution cannot drift between them.
      - uses: purview-dev/build/actions/dotnet-sdk@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # JavaScript tooling (Astro and anything it shells out to) checks `process.versions.node`
      # and refuses to run below its minimum. The runner image's Node drifts, so a build that
      # passed can fail later when the image ships a Node below a tool's floor; pin it instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}

      # Registered before the tool install so a build-version that exists only on GitHub Packages (a
      # version NuGet.org has not indexed yet) is resolvable. It is also before the repository's own
      # restores. Credentials are resolved from a macro at restore time, so nothing secret is written.
      # Fork pull requests never receive organisation secrets, so registering a private feed there
      # would only produce a 401 against a source the run cannot read. They restore from NuGet.org.
      - name: Configure NuGet sources
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: purview-dev/build/actions/nuget-sources@main
        with:
          namespace: ${{ github.repository_owner }}
          token: ${{ secrets.PURVIEW_PACKAGES_READ_TOKEN || github.token }}
          source-mapping: ${{ vars.PURVIEW_NUGET_SOURCE_MAPPING }}

      - name: Install shared build
        shell: bash
        env:
          # Resolves the %GITHUB_TOKEN% macro when the organisation read token was not used.
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_BUILD_VERSION: ${{ inputs.build-version }}
          TOOL_PATH: ${{ runner.temp }}/purview-build
        run: |
          set -euo pipefail

          # Quoted and passed as distinct arguments, not word-split from a string. Leaving
          # build-version empty installs whatever is latest on nuget.org at job time and runs it,
          # so callers should pin it.
          if [ -n "$INPUT_BUILD_VERSION" ]; then
            dotnet tool install Purview.Build --tool-path "$TOOL_PATH" --version "$INPUT_BUILD_VERSION"
          else
            echo "::warning title=Unpinned build tool::No build-version was supplied, so the latest Purview.Build on nuget.org will be installed and executed. Pin build-version for a reproducible build."
            dotnet tool install Purview.Build --tool-path "$TOOL_PATH"
          fi

      - name: Run shared build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Consumer repos historically store the key under NUGET__APIKEY; some use NUGET_APIKEY.
          # The tool reads the plain process env vars NUGET_APIKEY / NUGET_API_KEY.
          NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
          NUGET_API_KEY: ${{ secrets.NUGET__APIKEY }}
          Release__Mode: ${{ inputs.release-mode }}
          Build__RunTests: ${{ inputs.run-tests }}
          Build__RunLint: ${{ inputs.run-lint }}
          Build__RunPack: ${{ inputs.run-pack }}
          Build__ValidatePack: ${{ inputs.validate-pack }}
          INPUT_TEST_FILTER: ${{ inputs.test-filter }}
          INPUT_TEST_PROJECTS: ${{ inputs.test-projects }}
          INPUT_CONFIG_PATH: ${{ inputs.config-path }}
          TOOL_PATH: ${{ runner.temp }}/purview-build
        run: |
          set -euo pipefail

          # Only forward the optional test settings when the caller provides them.
          # Setting these to empty would override a consuming repo's purview-build.json
          # (env vars take precedence over the JSON config) and silently disable the filter.
          #
          # Assigned from env rather than interpolated into the script: these come from the
          # calling repository, and an inline expression would be substituted into the shell source text.
          [ -z "$INPUT_TEST_FILTER" ] || export Build__TestFilter="$INPUT_TEST_FILTER"
          [ -z "$INPUT_TEST_PROJECTS" ] || export Build__TestProjects="$INPUT_TEST_PROJECTS"
          [ -z "$INPUT_CONFIG_PATH" ] || export PURVIEW_BUILD_CONFIG="$INPUT_CONFIG_PATH"

          "$TOOL_PATH/purview-build"

      # A composite action cannot declare a post-step, so cleanup belongs to the workflow. Hosted
      # runners discard the user-level configuration with the VM; self-hosted runners do not.
      - name: Remove temporary NuGet sources
        if: always()
        uses: purview-dev/build/actions/nuget-sources@main
        with:
          mode: remove
