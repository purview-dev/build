name: Release

# The project builds itself: this workflow compiles and installs the tool from the
# current source, then runs it against this repository. The tool therefore performs
# the release build/test/pack/validate steps and tags and publishes itself (v{version}
# release + NuGet push) exactly like every other purview-dev repository.
on:
  push:
    branches: [main]

permissions:
  contents: write
  # The self-hosted release dogfoods the dual publication: the variable decides whether the extra
  # destination is used, and the token must be allowed to write it.
  packages: write

concurrency:
  group: purview-build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Resolved by the package source's %GITHUB_TOKEN% credential during restore and push.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Dogfoods the source configuration from the working tree, before the first restore.
      - name: Configure NuGet sources
        uses: ./actions/nuget-sources
        with:
          namespace: ${{ github.repository_owner }}
          token: ${{ secrets.PURVIEW_PACKAGES_READ_TOKEN || github.token }}
          source-mapping: ${{ vars.PURVIEW_NUGET_SOURCE_MAPPING }}

      # Irreducible: the tool cannot read its own version for `dotnet pack` before it has been
      # packed. Eligibility is NOT decided here — that is the tool's job, below.
      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/Build.slnx

      - name: Build gate
        run: dotnet build src/Build.slnx --configuration Release --no-restore --warnaserror

      - name: Pack tool from source
        run: >-
          dotnet pack src/Build.slnx
          --configuration Release --no-build --output artifacts
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Verify NuGet API key
        env:
          NUGET_APIKEY: ${{ secrets.NUGET__APIKEY }}
        run: |
          if [ -z "$NUGET_APIKEY" ]; then
            echo "The NUGET__APIKEY secret is not set. It is required to publish Purview.Build to nuget.org." >&2
            exit 1
          fi

      # --source, not --add-source: the release must be produced by the tool built from this commit,
      # and --add-source leaves nuget.org able to satisfy the version instead.
      - name: Install packed tool
        run: >-
          dotnet tool install Purview.Build
          --tool-path "$RUNNER_TEMP/purview-build"
          --source artifacts
          --version "${{ steps.version.outputs.version }}"

      - name: Evaluate release eligibility
        id: eligibility
        env:
          Release__Mode: NuGet
        run: |
          "$RUNNER_TEMP/purview-build/purview-build" release-explain --format=json > explain.json
          cat explain.json

          {
            echo "verdict=$(jq -r '.verdict' explain.json)"
            echo "release_mode=$(jq -r '.releaseMode' explain.json)"
          } >> "$GITHUB_OUTPUT"

          jq -r '.message' explain.json > eligibility-message.txt

      # The message is flattened to one line before it reaches a workflow command: a `::` sequence
      # after a newline would otherwise be parsed as a command rather than printed.
      - name: Report ineligible release
        if: steps.eligibility.outputs.verdict == 'Fail'
        run: |
          set -euo pipefail
          message="$(tr '\n' ' ' < eligibility-message.txt | sed 's/::/:﹕/g')"
          echo "::error title=Release not eligible::${message}"
          exit 1

      - name: Skip release
        if: steps.eligibility.outputs.verdict == 'Skip'
        run: |
          set -euo pipefail
          message="$(tr '\n' ' ' < eligibility-message.txt | sed 's/::/:﹕/g')"
          echo "::notice title=Release skipped::${message}"

      - name: Run release pipeline (builds, publishes and tags itself)
        if: steps.eligibility.outputs.verdict == 'Release'
        env:
          NUGET_APIKEY: ${{ secrets.NUGET__APIKEY }}
          Release__Mode: ${{ steps.eligibility.outputs.release_mode }}
          Release__UploadArtifacts: "true"
          NuGet__FeedUrl: https://api.nuget.org/v3/index.json
          # Opt-in only: without the repository variable this release publishes to NuGet.org exactly as
          # it always has. With it, the same packages also go to the organisation feed.
          NuGet__GitHubPackages__Enabled: ${{ vars.PURVIEW_PUBLISH_GITHUB_PACKAGES == 'true' }}
          NuGet__GitHubPackages__Owner: ${{ github.repository_owner }}
          # The release path publishes to nuget.org and tags the repository, so it is the last place
          # that should take the build on trust. Tests and lint run here as they do on a PR.
          Build__RunTests: "true"
          Build__RunLint: "true"
          Build__ValidatePack: "true"
        run: "$RUNNER_TEMP/purview-build/purview-build"

      # Mirror housekeeping, never a release gate: NuGet.org holds every version.
      - name: Prune older GitHub Packages versions
        if: steps.eligibility.outputs.verdict == 'Release' && steps.eligibility.outputs.release_mode == 'NuGet' && vars.PURVIEW_PUBLISH_GITHUB_PACKAGES == 'true'
        uses: ./actions/prune-github-packages
        with:
          namespace: ${{ github.repository_owner }}
          keep-versions: ${{ vars.PURVIEW_GITHUB_PACKAGES_KEEP_VERSIONS || '1' }}
          retention-hours: ${{ vars.PURVIEW_GITHUB_PACKAGES_RETENTION_HOURS || '24' }}
          version: ${{ steps.version.outputs.version }}

      - name: Remove temporary NuGet sources
        if: always()
        uses: ./actions/nuget-sources
        with:
          mode: remove
