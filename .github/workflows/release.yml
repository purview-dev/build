name: Release

# The project builds itself: this workflow compiles and installs the tool from the
# current source, then runs it against this repository. The tool therefore performs
# the release build/test/pack/validate steps and tags and publishes itself (v{version}
# release + NuGet push) exactly like every other purview-dev repository.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: purview-build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: oven-sh/setup-bun@v2

      # Irreducible: the tool cannot read its own version for `dotnet pack` before it has been
      # packed. Eligibility is NOT decided here — that is the tool's job, below.
      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/Build.slnx

      - name: Build gate
        run: dotnet build src/Build.slnx --configuration Release --no-restore --warnaserror

      - name: Pack tool from source
        run: >-
          dotnet pack src/Build.slnx
          --configuration Release --no-build --output artifacts
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Verify NuGet API key
        env:
          NUGET_APIKEY: ${{ secrets.NUGET__APIKEY }}
        run: |
          if [ -z "$NUGET_APIKEY" ]; then
            echo "The NUGET__APIKEY secret is not set. It is required to publish Purview.Build to nuget.org." >&2
            exit 1
          fi

      - name: Install packed tool
        run: >-
          dotnet tool install Purview.Build
          --tool-path "$RUNNER_TEMP/purview-build"
          --add-source artifacts
          --version "${{ steps.version.outputs.version }}"

      - name: Evaluate release eligibility
        id: eligibility
        env:
          Release__Mode: NuGet
        run: |
          "$RUNNER_TEMP/purview-build/purview-build" release-explain --format=json > explain.json
          cat explain.json

          {
            echo "verdict=$(jq -r '.verdict' explain.json)"
            echo "release_mode=$(jq -r '.releaseMode' explain.json)"
          } >> "$GITHUB_OUTPUT"

          jq -r '.message' explain.json > eligibility-message.txt

      - name: Report ineligible release
        if: steps.eligibility.outputs.verdict == 'Fail'
        run: |
          echo "::error title=Release not eligible::$(cat eligibility-message.txt)"
          exit 1

      - name: Skip release
        if: steps.eligibility.outputs.verdict == 'Skip'
        run: echo "::notice title=Release skipped::$(cat eligibility-message.txt)"

      - name: Run release pipeline (builds, publishes and tags itself)
        if: steps.eligibility.outputs.verdict == 'Release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_APIKEY: ${{ secrets.NUGET__APIKEY }}
          Release__Mode: ${{ steps.eligibility.outputs.release_mode }}
          Release__UploadArtifacts: "true"
          NuGet__FeedUrl: https://api.nuget.org/v3/index.json
          Build__RunTests: "false"
          Build__RunLint: "false"
          Build__ValidatePack: "true"
        run: "$RUNNER_TEMP/purview-build/purview-build"
