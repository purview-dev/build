name: Release

# The project builds itself: this workflow compiles and installs the tool from the
# current source, then runs it against this repository. The tool therefore performs
# the release build/test/pack/validate steps and tags and publishes itself (v{version}
# release + NuGet push) exactly like every other purview-dev repository.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: purview-build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version '$VERSION' is not SemVer." >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Version $VERSION is already released as $TAG."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore
        if: steps.version.outputs.release == 'true'
        run: dotnet restore src/Purview.Build/Purview.Build.csproj --locked-mode

      - name: Build gate
        if: steps.version.outputs.release == 'true'
        run: dotnet build src/Purview.Build/Purview.Build.csproj --configuration Release --no-restore --warnaserror

      - name: Pack tool from source
        if: steps.version.outputs.release == 'true'
        run: >-
          dotnet pack src/Purview.Build/Purview.Build.csproj
          --configuration Release --no-build --output artifacts
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Verify NuGet API key
        if: steps.version.outputs.release == 'true'
        env:
          NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
        run: |
          if [ -z "$NUGET_APIKEY" ]; then
            echo "The NUGET_APIKEY secret is not set. It is required to publish Purview.Build to nuget.org." >&2
            exit 1
          fi

      - name: Install packed tool
        if: steps.version.outputs.release == 'true'
        run: >-
          dotnet tool install Purview.Build
          --tool-path "$RUNNER_TEMP/purview-build"
          --add-source artifacts
          --version "${{ steps.version.outputs.version }}"

      - name: Run release pipeline (builds, publishes and tags itself)
        if: steps.version.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
          Release__Mode: NuGet
          Release__UploadArtifacts: "true"
          NuGet__FeedUrl: https://api.nuget.org/v3/index.json
          Build__RunTests: "false"
          Build__RunLint: "false"
          Build__ValidatePack: "false"
        run: "$RUNNER_TEMP/purview-build/purview-build"