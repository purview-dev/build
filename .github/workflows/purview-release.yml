name: Purview Release

on:
  workflow_call:
    inputs:
      build-version:
        description: >-
          Exact Purview.Build package version to run. When omitted, the latest stable version
          from nuget.org is installed.
        required: false
        type: string
      dotnet-version:
        description: >-
          .NET SDK used by the consuming repository. Ignored when global.json pins an sdk.version,
          because every dotnet command resolves against global.json and installing anything else
          fails the job.
        required: false
        default: 10.0.x
        type: string
      node-version:
        description: >-
          Node.js used by the consuming repository's JavaScript tooling (for example Astro, which
          refuses to run below its minimum). Pinned rather than inherited from the runner image,
          whose Node version drifts between builds.
        required: false
        default: 26.x
        type: string
      release-mode:
        description: Release__Mode passed to the pipeline (NuGet or GitHubRelease).
        required: false
        default: NuGet
        type: string
      release-branch:
        description: >-
          Branch that triggers this release (main or release). Retained for backward compatibility;
          callers now control release serialization via their own concurrency group.
        required: false
        default: main
        type: string
      config-path:
        description: >-
          Explicit purview-build.json location (PURVIEW_BUILD_CONFIG). When omitted, the tool uses
          its documented probe order starting at the repository root.
        required: false
        type: string
      eligibility-policy:
        description: >-
          Release eligibility policy to evaluate (Release__Eligibility__Policy), e.g.
          TrunkReservesMinor. When omitted, the repository's own configuration decides.
        required: false
        type: string
      release-channel:
        description: Named release channel (Release__Channel), e.g. stable or preview.
        required: false
        type: string
      version-source:
        description: Where the version comes from (Version__Source). Currently PackageJson.
        required: false
        type: string
      run-tests:
        description: Enable discovered tests (Build__RunTests).
        required: false
        default: true
        type: boolean
      run-lint:
        description: Enable CSharpier linting (Build__RunLint).
        required: false
        default: true
        type: boolean
      run-pack:
        description: Enable packing (Build__RunPack).
        required: false
        default: true
        type: boolean
      validate-pack:
        description: Enable pack validation (Build__ValidatePack).
        required: false
        default: true
        type: boolean
      test-filter:
        description: Test filter (Build__TestFilter), e.g. "/*/*/*/*[Category=Unit]".
        required: false
        type: string
      upload-artifacts:
        description: Upload artifacts folder files as GitHub release assets (Release__UploadArtifacts).
        required: false
        default: false
        type: boolean
    secrets:
      NUGET_APIKEY:
        required: false
      # Declared because consuming repositories historically store the key under this name and the
      # action receives it as one value. A secret referenced but not declared here resolves only
      # under `secrets: inherit`; declaring it makes the contract explicit either way.
      NUGET__APIKEY:
        required: false
      # Optional organisation-level classic PAT with read:packages, used to restore from the mirror
      # without per-package Actions-access grants. Falls back to the workflow token when absent.
      PURVIEW_PACKAGES_READ_TOKEN:
        required: false

# This workflow is a delegator. The release implementation lives in
# actions/purview-release/action.yml, and this file exists only so callers that already reference
# it keep working.
#
# It deliberately offers no Trusted Publishing inputs. nuget.org validates the OIDC
# `job_workflow_ref` claim against the registered policy, and inside a reusable workflow that claim
# names this repository, not the caller — the exchange fails with "No matching trust policy"
# (NuGet/NuGetGallery#11000). Trusted Publishing therefore requires calling the composite action
# from the consuming repository's own job, which is the file name a policy is registered against.
#
# Deliberately no `permissions:` block either. Callers own their token, and a block here grants
# nothing while adding a ceiling GitHub validates against the caller statically, before any input is
# read. See the Getting Started and Release Flow wiki pages.

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run the release pipeline
        uses: purview-dev/build/actions/purview-release@main
        with:
          build-version: ${{ inputs.build-version }}
          dotnet-version: ${{ inputs.dotnet-version }}
          node-version: ${{ inputs.node-version }}
          release-mode: ${{ inputs.release-mode }}
          config-path: ${{ inputs.config-path }}
          eligibility-policy: ${{ inputs.eligibility-policy }}
          release-channel: ${{ inputs.release-channel }}
          version-source: ${{ inputs.version-source }}
          run-tests: ${{ inputs.run-tests }}
          run-lint: ${{ inputs.run-lint }}
          run-pack: ${{ inputs.run-pack }}
          validate-pack: ${{ inputs.validate-pack }}
          test-filter: ${{ inputs.test-filter }}
          upload-artifacts: ${{ inputs.upload-artifacts }}
          # A composite action has no `secrets` or `vars` context, so credentials and repository
          # variables are handed over here.
          nuget-api-key: ${{ secrets.NUGET_APIKEY || secrets.NUGET__APIKEY }}
          packages-read-token: ${{ secrets.PURVIEW_PACKAGES_READ_TOKEN }}
          source-mapping: ${{ vars.PURVIEW_NUGET_SOURCE_MAPPING }}
          github-packages: ${{ vars.PURVIEW_PUBLISH_GITHUB_PACKAGES == 'true' }}
          github-packages-keep-versions: ${{ vars.PURVIEW_GITHUB_PACKAGES_KEEP_VERSIONS || '1' }}
          github-packages-retention-hours: ${{ vars.PURVIEW_GITHUB_PACKAGES_RETENTION_HOURS || '24' }}
