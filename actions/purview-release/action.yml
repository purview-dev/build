name: Purview Release

description: >-
  Runs the release pipeline against the calling repository: evaluates release eligibility with the
  pinned Purview.Build tool, exchanges a GitHub OIDC token for a short-lived nuget.org key when
  Trusted Publishing is enabled, runs the pipeline, and prunes the GitHub Packages mirror.

  This is a composite action rather than a reusable workflow because nuget.org validates the OIDC
  `job_workflow_ref` claim against the registered Trusted Publishing policy. Inside a reusable
  workflow that claim names this repository (or any other called workflow), never the caller, so
  the exchange fails with "No matching trust policy" — see NuGet/NuGetGallery#11000. A composite
  action's steps run inside the caller's own job, which keeps the claim pointing at the caller's
  workflow file. That is the file the policy must name.

  Callers grant `contents: write` to tag and create the release, `packages: write` for the GitHub
  Packages mirror, and `id-token: write` for Trusted Publishing. A composite action cannot declare
  permissions of its own.

inputs:
  build-version:
    description: >-
      Exact Purview.Build package version to run. When omitted, the latest stable version
      from nuget.org is installed.
    required: false
    default: ""
  dotnet-version:
    description: >-
      .NET SDK used by the consuming repository. Ignored when global.json pins an sdk.version,
      because every dotnet command resolves against global.json and installing anything else
      fails the job.
    required: false
    default: 10.0.x
  node-version:
    description: >-
      Node.js used by the consuming repository's JavaScript tooling (for example Astro, which
      refuses to run below its minimum). Pinned rather than inherited from the runner image,
      whose Node version drifts between builds.
    required: false
    default: 26.x
  release-mode:
    description: Release__Mode passed to the pipeline (NuGet or GitHubRelease).
    required: false
    default: NuGet
  config-path:
    description: >-
      Explicit purview-build.json location (PURVIEW_BUILD_CONFIG). When omitted, the tool uses
      its documented probe order starting at the repository root.
    required: false
    default: ""
  eligibility-policy:
    description: >-
      Release eligibility policy to evaluate (Release__Eligibility__Policy), e.g.
      TrunkReservesMinor. When omitted, the repository's own configuration decides.
    required: false
    default: ""
  release-channel:
    description: Named release channel (Release__Channel), e.g. stable or preview.
    required: false
    default: ""
  version-source:
    description: Where the version comes from (Version__Source). Currently PackageJson.
    required: false
    default: ""
  trusted-publishing:
    description: >-
      Use NuGet Trusted Publishing instead of a stored API key. The job exchanges a GitHub
      OIDC token for a short-lived nuget.org key, so no long-lived secret is involved. The
      caller must grant `id-token: write`, and nuget.org must have a Trusted Publishing policy
      registered for this repository and this workflow file.
    required: false
    default: "false"
  nuget-user:
    description: >-
      nuget.org profile name that owns the Trusted Publishing policy. This is the profile name,
      not the sign-in email. Required when trusted-publishing is true.
    required: false
    default: ""
  nuget-api-key:
    description: >-
      A long-lived nuget.org key for callers that have not migrated to Trusted Publishing. Ignored
      outright when trusted-publishing is true, so a leftover secret cannot keep publishing the old
      way while the configuration looks migrated.
    required: false
    default: ""
  run-tests:
    description: Enable discovered tests (Build__RunTests).
    required: false
    default: "true"
  run-lint:
    description: Enable CSharpier linting (Build__RunLint).
    required: false
    default: "true"
  run-pack:
    description: Enable packing (Build__RunPack).
    required: false
    default: "true"
  validate-pack:
    description: Enable pack validation (Build__ValidatePack).
    required: false
    default: "true"
  test-filter:
    description: Test filter (Build__TestFilter), e.g. "/*/*/*/*[Category=Unit]".
    required: false
    default: ""
  upload-artifacts:
    description: Upload artifacts folder files as GitHub release assets (Release__UploadArtifacts).
    required: false
    default: "false"
  packages-read-token:
    description: >-
      Optional classic PAT with read:packages used to read the organisation GitHub Packages feed.
      Defaults to the workflow token. A composite action has no `secrets` context, so a caller that
      uses the organisation token has to pass it here.
    required: false
    default: ""
  source-mapping:
    description: >-
      Optional semicolon-separated package ID patterns pinned to GitHub Packages. Pass the
      repository variable `PURVIEW_NUGET_SOURCE_MAPPING`; a composite action has no `vars` context.
    required: false
    default: ""
  github-packages:
    description: >-
      Publish the same packages to GitHub Packages as well. Pass `true` only when the repository
      variable `PURVIEW_PUBLISH_GITHUB_PACKAGES` is `true`; a composite action has no `vars` context.
    required: false
    default: "false"
  github-packages-keep-versions:
    description: >-
      Newest versions per package always kept by the mirror cleanup (repository variable
      `PURVIEW_GITHUB_PACKAGES_KEEP_VERSIONS`).
    required: false
    default: "1"
  github-packages-retention-hours:
    description: >-
      How long a mirrored version survives after publication (repository variable
      `PURVIEW_GITHUB_PACKAGES_RETENTION_HOURS`).
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # Eligibility is judged against the tags that already exist, so the full tag list
        # has to be present before the tool evaluates anything.
        fetch-depth: 0
        fetch-tags: true

    # global.json is the single source of truth for the SDK whenever it pins one; see the matching
    # step in purview-build.yml. When it pins nothing, the dotnet-version input applies.
    - name: Resolve the .NET SDK version
      id: resolve-sdk
      shell: bash
      # Caller input reaches the script through env, never by interpolating an expression into the script: the
      # value is substituted into the script text before bash sees it, so a crafted input would
      # run as shell.
      env:
        INPUT_DOTNET_VERSION: ${{ inputs.dotnet-version }}
      run: |
        set -euo pipefail

        pinned=""
        if [ -f global.json ]; then
          pinned="$(jq -r '.sdk.version // empty' global.json)"
        fi

        if [ -n "$pinned" ]; then
          echo "global.json pins $pinned; installing that."
          echo "dotnet-version=$pinned" >> "$GITHUB_OUTPUT"
        else
          echo "global.json pins no sdk.version; using the dotnet-version input ($INPUT_DOTNET_VERSION)."
          echo "dotnet-version=$INPUT_DOTNET_VERSION" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: ${{ steps.resolve-sdk.outputs.dotnet-version }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    # JavaScript tooling (Astro and anything it shells out to) checks `process.versions.node`
    # and refuses to run below its minimum. The runner image's Node drifts, so pin it.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}

    # Before the tool install, so a build-version that exists only on GitHub Packages is resolvable.
    # A fork pull request cannot read the private feed (no organisation secrets), so leave it on
    # NuGet.org rather than registering a source every restore would be denied.
    - name: Configure NuGet sources
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
      uses: purview-dev/build/actions/nuget-sources@main
      with:
        namespace: ${{ github.repository_owner }}
        token: ${{ inputs.packages-read-token || github.token }}
        source-mapping: ${{ inputs.source-mapping }}

    - name: Install shared build
      shell: bash
      env:
        # Resolves the %GITHUB_TOKEN% macro when the organisation read token was not used.
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_BUILD_VERSION: ${{ inputs.build-version }}
        TOOL_PATH: ${{ runner.temp }}/purview-build
      run: |
        set -euo pipefail

        # Quoted and passed as distinct arguments, not word-split from a string. Leaving
        # build-version empty installs whatever is latest on nuget.org at job time and runs it,
        # so callers should pin it.
        if [ -n "$INPUT_BUILD_VERSION" ]; then
          dotnet tool install Purview.Build --tool-path "$TOOL_PATH" --version "$INPUT_BUILD_VERSION"
        else
          echo "::warning title=Unpinned build tool::No build-version was supplied, so the latest Purview.Build on nuget.org will be installed and executed. Pin build-version for a reproducible release."
          dotnet tool install Purview.Build --tool-path "$TOOL_PATH"
        fi

    # The version is reported, never decided: eligibility remains the tool's evaluation below. It is
    # used only to protect the just-published version from the package cleanup.
    - name: Read release version
      id: version
      shell: bash
      run: |
        version=""
        if [ -f package.json ]; then
          version="$(jq -r '.version // ""' package.json)"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Evaluate release eligibility
      id: eligibility
      shell: bash
      env:
        # release-explain reports the decision the pipeline would take, so it needs the caller's mode.
        Release__Mode: ${{ inputs.release-mode }}
      run: |
        set -euo pipefail

        # The tool evaluates; this action decides. release-explain runs no module, mutates
        # nothing, and always exits 0 — the decision is in its JSON.
        "${{ runner.temp }}/purview-build/purview-build" release-explain --format=json > explain.json
        cat explain.json

        {
          echo "verdict=$(jq -r '.verdict' explain.json)"
          echo "release_mode=$(jq -r '.releaseMode' explain.json)"
          echo "decided_by=$(jq -r '.decidedByRule // ""' explain.json)"
        } >> "$GITHUB_OUTPUT"

        jq -r '.message' explain.json > eligibility-message.txt

    - name: Report ineligible release
      if: steps.eligibility.outputs.verdict == 'Fail'
      shell: bash
      run: |
        set -euo pipefail

        # Workflow commands are parsed out of the log line, so a message containing a newline
        # and a `::` sequence would be interpreted as a command rather than printed. Escape the
        # message to a single line before handing it over.
        message="$(tr '\n' ' ' < eligibility-message.txt | sed 's/::/:﹕/g')"
        echo "::error title=Release not eligible::${message}"
        exit 1

    - name: Skip release
      if: steps.eligibility.outputs.verdict == 'Skip'
      shell: bash
      run: |
        set -euo pipefail
        message="$(tr '\n' ' ' < eligibility-message.txt | sed 's/::/:﹕/g')"
        echo "::notice title=Release skipped::${message}"

    - name: Require a nuget.org profile for Trusted Publishing
      if: steps.eligibility.outputs.verdict == 'Release' && inputs.trusted-publishing == 'true' && inputs.nuget-user == ''
      shell: bash
      run: |
        echo "::error title=nuget-user is required::trusted-publishing is enabled, but no nuget-user was supplied. Pass the nuget.org profile name that owns the Trusted Publishing policy."
        exit 1

    # Immediately before the push: the minted key is valid for one hour, and each OIDC token can
    # be exchanged exactly once. This step must live in the caller's job; a policy registered for
    # the caller's workflow file will not match a key minted inside a called workflow.
    - name: Exchange the OIDC token for a short-lived nuget.org key
      id: nuget-login
      if: steps.eligibility.outputs.verdict == 'Release' && inputs.trusted-publishing == 'true'
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.nuget-user }}

    - name: Run release pipeline
      if: steps.eligibility.outputs.verdict == 'Release'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # The evaluated decision, not the raw input: a verdict that is not "Release" resolves to
        # None, so the publish and release modules skip even if this step were reached.
        Release__Mode: ${{ steps.eligibility.outputs.release_mode }}
        Release__UploadArtifacts: ${{ inputs.upload-artifacts }}
        NuGet__TrustedPublishing: ${{ inputs.trusted-publishing }}
        NuGet__GitHubPackages__Enabled: ${{ inputs.github-packages }}
        NuGet__GitHubPackages__Owner: ${{ github.repository_owner }}
        Build__RunTests: ${{ inputs.run-tests }}
        Build__RunLint: ${{ inputs.run-lint }}
        Build__RunPack: ${{ inputs.run-pack }}
        Build__ValidatePack: ${{ inputs.validate-pack }}
        # Optional settings are read from the environment and applied only when non-empty. Exporting
        # an omitted input as the empty string would override the repository's purview-build.json,
        # because environment variables outrank the JSON file.
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_ELIGIBILITY_POLICY: ${{ inputs.eligibility-policy }}
        INPUT_RELEASE_CHANNEL: ${{ inputs.release-channel }}
        INPUT_VERSION_SOURCE: ${{ inputs.version-source }}
        INPUT_TEST_FILTER: ${{ inputs.test-filter }}
        # Credentials are chosen below rather than in an expression. GitHub evaluates the empty
        # string as falsy, so an and/or expression whose true-branch is `''` yields the fallback
        # instead of the empty string — the leftover secret would silently keep publishing the old
        # way.
        INPUT_TRUSTED_PUBLISHING: ${{ inputs.trusted-publishing }}
        INPUT_LEGACY_API_KEY: ${{ inputs.nuget-api-key }}
        INPUT_MINTED_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        TOOL_PATH: ${{ runner.temp }}/purview-build
      run: |
        set -euo pipefail

        # Assigned from env rather than interpolated into the script: these come from the calling
        # repository, and an inline expression would be substituted into the shell source text.
        [ -z "$INPUT_CONFIG_PATH" ] || export PURVIEW_BUILD_CONFIG="$INPUT_CONFIG_PATH"
        [ -z "$INPUT_ELIGIBILITY_POLICY" ] || export Release__Eligibility__Policy="$INPUT_ELIGIBILITY_POLICY"
        [ -z "$INPUT_RELEASE_CHANNEL" ] || export Release__Channel="$INPUT_RELEASE_CHANNEL"
        [ -z "$INPUT_VERSION_SOURCE" ] || export Version__Source="$INPUT_VERSION_SOURCE"
        [ -z "$INPUT_TEST_FILTER" ] || export Build__TestFilter="$INPUT_TEST_FILTER"

        # Trusted Publishing wins outright when enabled. The tool prefers NUGET_APIKEY over
        # NUGET_API_KEY, so a leftover long-lived secret would otherwise shadow the short-lived key
        # and keep publishing the old way while the configuration looked migrated.
        export NUGET_APIKEY=""
        if [ "$INPUT_TRUSTED_PUBLISHING" = "true" ]; then
          export NUGET_API_KEY="$INPUT_MINTED_API_KEY"
        else
          export NUGET_API_KEY="$INPUT_LEGACY_API_KEY"
        fi

        "$TOOL_PATH/purview-build"

    # Housekeeping on the mirror only: NuGet.org keeps every version, so this is best effort and
    # never fails a release. Only reached when the pipeline (both registries) succeeded.
    - name: Prune older GitHub Packages versions
      if: steps.eligibility.outputs.verdict == 'Release' && steps.eligibility.outputs.release_mode == 'NuGet' && inputs.github-packages == 'true'
      uses: purview-dev/build/actions/prune-github-packages@main
      with:
        namespace: ${{ github.repository_owner }}
        keep-versions: ${{ inputs.github-packages-keep-versions }}
        retention-hours: ${{ inputs.github-packages-retention-hours }}
        version: ${{ steps.version.outputs.version }}

    # A composite action cannot declare a post-step, so cleanup lives here and runs even when a
    # step above failed. Hosted runners discard the user-level configuration with the VM;
    # self-hosted runners do not.
    - name: Remove temporary NuGet sources
      if: always()
      uses: purview-dev/build/actions/nuget-sources@main
      with:
        mode: remove
